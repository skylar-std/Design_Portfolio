<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects | 홍길동 Design Portfolio</title>
  <meta name="description" content="디자이너 홍길동의 작업물 모음" />

  <meta property="og:title" content="Projects | 홍길동 Design Portfolio" />
  <meta property="og:description" content="디자이너 홍길동의 작업물 모음" />
  <meta property="og:image" content="img/og-image.svg" />

  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />

  <!-- 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <!-- 스타일 -->
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">HONG<span>.</span></a>

      <nav class="nav" id="nav">
        <a href="index.html#about" class="nav__link">About</a>
        <a href="index.html#skills" class="nav__link">Skills</a>
        <a href="works.html" class="nav__link is-current" aria-current="page">Projects</a>
        <a href="index.html#contact" class="nav__link">Contact</a>
      </nav>

      <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">

    <!-- ===== Page head ===== -->
    <section class="page-head">
      <div class="container">
        <a href="index.html" class="page-head__back reveal">← Home</a>
        <h1 class="page-head__title reveal">Pro<em>jects</em></h1>
        <p class="page-head__desc reveal">대표 작업과 전체 작업 기록을 모았습니다. 카드를 누르면 자세한 내용을 볼 수 있어요.</p>
      </div>
    </section>

    <!-- ===== Selected Work ===== -->
    <section class="section work" id="work">
      <div class="container">
        <div class="section__head reveal">
          <h2 class="section__title">Selected <em>Work</em></h2>
          <div class="filter" id="filter" role="tablist">
            <button class="filter__btn is-active" data-filter="all">All</button>
            <button class="filter__btn" data-filter="branding">Branding</button>
            <button class="filter__btn" data-filter="uiux">UI/UX</button>
            <button class="filter__btn" data-filter="graphic">Graphic</button>
          </div>
        </div>

        <!-- 프로젝트 카드는 js/projects.js 데이터로 자동 생성됩니다 -->
        <ul class="work__grid" id="workGrid"></ul>
      </div>
    </section>

    <!-- ===== Archive (연도 → 월별 보기) ===== -->
    <section class="section archive" id="archive">
      <div class="container">
        <div class="section__head reveal">
          <div>
            <h2 class="section__title">Archive</h2>
            <p class="archive__lead">연도를 고르고, 월을 눌러 그 달의 작업만 모아 보세요.</p>
          </div>
          <div class="archive__years" id="archiveYears" role="tablist" aria-label="연도 선택"></div>
        </div>

        <div class="archive__months reveal" id="archiveMonths" aria-label="월 선택"></div>

        <div class="archive__summary">
          <p id="archiveSummary" aria-live="polite"></p>
          <button type="button" class="archive__reset" id="archiveReset" hidden>전체 월 보기 ↺</button>
        </div>

        <div class="archive__list" id="archiveList"></div>
      </div>
    </section>
  </main>

  <footer class="footer footer--light">
    <div class="container footer__inner">
      <p>© <span id="year"></span> Hong Gildong. All rights reserved.</p>
      <a href="#top" class="footer__top">Back to top ↑</a>
    </div>
  </footer>

  <!-- ===== Project Modal ===== -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <article class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" data-close aria-label="닫기">✕</button>
      <img class="modal__img" id="modalImg" src="" alt="" />
      <div class="modal__body">
        <p class="modal__meta" id="modalMeta"></p>
        <h3 class="modal__title" id="modalTitle"></h3>
        <p class="modal__desc" id="modalDesc"></p>
        <ul class="modal__tags" id="modalTags"></ul>
        <a class="btn btn--primary modal__link" id="modalLink" href="#" target="_blank" rel="noopener">자세히 보기 ↗</a>
      </div>
    </article>
  </div>

  <!-- 스크립트 (순서 중요: 데이터 → 작업물 페이지 → 공통) -->
  <script src="js/projects.js"></script>
  <script src="js/works.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
